<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">Flipkart</div>
        <input type="text" placeholder="Search for products, brands and more">
        <button>Login</button>
        <a href="#">Cart</a>
    </header>

    <!-- Categories -->
    <section class="categories">
        <div>Mobiles</div>
        <div>Fashion</div>
        <div>Electronics</div>
        <div>Home</div>
        <div>Appliances</div>
        <div>Travel</div>
        <div>Beauty</div>
    </section>

    <!-- Banner -->
    <section class="banner">
        <h2>Big Billion Days Sale</h2>
    </section>

    <!-- Products -->
    <section class="products">
        <div class="card">
            <img src="https://via.placeholder.com/150">
            <p>Product 1</p>
            <span>₹999</span>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <p>Product 2</p>
            <span>₹1499</span>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <p>Product 3</p>
            <span>₹1999</span>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <p>Product 4</p>
            <span>₹2499</span>
        </div>
    </section>

</body>
</html>
